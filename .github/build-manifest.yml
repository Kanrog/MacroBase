name: Build Macro Manifest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Parser Script
        run: python3 scripts/build_manifest.py

      - name: Commit and Push if manifest changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update macro manifest.json [skip ci]"
          file_pattern: manifest.json