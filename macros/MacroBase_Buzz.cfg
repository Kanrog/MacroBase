#=====================================================
# BUZZ_E
#=====================================================
# @DESC Oscillates the extruder stepper motor (moves 1mm in each direction 10 times) to verify correct wiring and rotation direction.
[gcode_macro BUZZ_E]
description: Buzz test
gcode:
    STEPPER_BUZZ STEPPER=extruder