# ==============================================================================
# MACRO CONFIGURATION & USAGE
# ==============================================================================
# HOW TO ENABLE OR DISABLE MACROS:
# Klipper reads every active macro in this file (If enabled in "MacroBase.cfg"). To disable a specific macro 
# so it doesn't appear in your interface or load into Klipper, you must "comment 
# it out" by placing a hashtag (#) at the very beginning of every line for 
# that specific macro, starting with the [gcode_macro NAME] line.
# 
# To re-enable a macro, simply remove the hashtags from the start of its lines.
# ==============================================================================

#=====================================================
# PRINT_START
#=====================================================
# @DESC Master startup routine for initiating a print. Handles heating, homing, leveling, meshing, and purging. Fully customizable by commenting/uncommenting sections.
[gcode_macro PRINT_START]
description: Master print start macro
gcode:
    # -------------------------------------------------------------------------
    # 1. SLICER PARAMETERS & VARIABLES
    # -------------------------------------------------------------------------
    # These variables catch the temperatures sent by your slicer. 
    # Make sure your slicer's custom start G-code passes these variables!
    # Example for OrcaSlicer/PrusaSlicer: PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
    
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}      ; Target bed temperature from slicer
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %} ; Target nozzle temperature from slicer
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %} ; Target chamber temperature from slicer
    {% set PROBE_TEMP = 150 %}                                  ; Safe nozzle temperature for probing without oozing

    # -------------------------------------------------------------------------
    # 2. INITIALIZATION & STATUS
    # -------------------------------------------------------------------------
    # LED_PRINT                                                 ; Sets LED strip to print lighting (Requires MacroBase_LED)
    # PRINT_PROGRESS                                            ; Starts LED progress tracking (Requires MacroBase_LED)
    
    G90                                                         ; Use absolute coordinates
    M83                                                         ; Set extruder to relative mode
    G92 E0                                                      ; Reset extruder distance

    # -------------------------------------------------------------------------
    # 3. PRE-HEATING
    # -------------------------------------------------------------------------
    M117 Pre-heating...
    M140 S{BED_TEMP}                                            ; Start heating bed without waiting
    M104 S{PROBE_TEMP}                                          ; Start heating nozzle to safe probe temp without waiting
    
    # HEAT_CHAMBER                                              ; Use the MacroBase chamber heating macro (Requires "HEAT_CHAMBER" from MacroBase_Extras)
    # M191 S{CHAMBER_TEMP}                                      ; Wait for active chamber heater to reach temp
    
    M190 S{BED_TEMP}                                            ; Wait for bed to reach target temperature
    M109 S{PROBE_TEMP}                                          ; Wait for nozzle to reach probe temperature

    # -------------------------------------------------------------------------
    # 4. HOMING & GANTRY LEVELING
    # -------------------------------------------------------------------------
    M117 Homing and Leveling...
    G28                                                         ; Home X, Y, and Z axes
    
    # LEVEL_Z_TILT                                              ; Level dual or triple independent Z motors (Requires "LEVEL_Z_TIL" from MacroBase_Leveling)
    # QUAD_GANTRY_LEVEL                                         ; Level 4-motor gantry (For Voron V2.4, etc.)
    # G28 Z                                                     ; Re-home Z after leveling (Highly recommended if using Z-Tilt or QGL)

    # -------------------------------------------------------------------------
    # 5. BED MESH
    # -------------------------------------------------------------------------
    M117 Generating Mesh...
    BED_MESH_CLEAR                                              ; Clear any existing loaded bed mesh
    
    # BED_MESH_PROFILE LOAD=default                             ; Load a previously saved static default mesh
    # GENERATE_BED_MESH BED_TEMP={BED_TEMP}                     ; Generate a fresh automated bed mesh (Requires "GENERATE_BED_MESH" fromMacroBase_Leveling)
    # BED_MESH_CALIBRATE ADAPTIVE=1                             ; Generate a fresh Klipper native adaptive bed mesh

    # -------------------------------------------------------------------------
    # 6. FINAL HEATING
    # -------------------------------------------------------------------------
    M117 Final Heating...
    # _PARK                                                      ; Move toolhead to a safe park position (Requires "_PARK" from MacroBase_Extras)
    M109 S{EXTRUDER_TEMP}                                       ; Wait for nozzle to reach final print temperature
    
    # -------------------------------------------------------------------------
    # 7. PRIME LINE & PURGE
    # -------------------------------------------------------------------------
    # _CLEAN_NOZZLE                                              ; Run automated nozzle scrub over a brush (Requires "_CLEAN_NOZZLE" from MacroBase_Maintenance)
    
    PRIME_LINE                                                  ; Execute the dynamic front center prime line macro
    
    M117 Printing!

#=====================================================
# PRIME_LINE
#=====================================================
# INSTRUCTIONS:
# You can easily adjust the amount of filament purged by changing the 
# PURGE_AMOUNT variable below. Increase it if you need more flow to transition
# filament colors, or decrease it to save material.
# 
# @DESC Dynamically calculates bed center and draws an adjustable purge line at the front edge of the bed.
[gcode_macro PRIME_LINE]
description: Dynamic front center prime line
gcode:
    # --- USER ADJUSTABLE VARIABLES ---
    {% set PURGE_AMOUNT = 30 %}  ; The total amount of filament (in mm) to extrude during the prime line.
    {% set LINE_LENGTH = 100 %}  ; The total length of the prime line in mm.
    {% set Y_OFFSET = 5 %}       ; How far from the absolute front edge (Y=0) to draw the line.
    {% set Z_HEIGHT = 0.28 %}    ; The Z height for the prime line.
    
    # --- CALCULATIONS ---
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set center_x = max_x / 2.0 %}
    {% set start_x = center_x - (LINE_LENGTH / 2.0) %}
    {% set end_x = center_x + (LINE_LENGTH / 2.0) %}
    
    # --- EXECUTION ---
    SAVE_GCODE_STATE NAME=prime_line_state
    M117 Purging...
    G90                          ; Absolute positioning
    M83                          ; Relative extruder positioning
    G92 E0                       ; Reset extruder distance
    
    G1 Z5.0 F3000                ; Lift Z safely before moving
    G1 X{start_x} Y{Y_OFFSET} F5000 ; Move to calculated starting position
    G1 Z{Z_HEIGHT} F1500         ; Lower Z to target prime height
    
    # Extrude the prime line from start_x to end_x
    G1 X{end_x} Y{Y_OFFSET} Z{Z_HEIGHT} F1500 E{PURGE_AMOUNT}
    
    # Wipe and detach
    G1 X{end_x + 10} Y{Y_OFFSET} Z{Z_HEIGHT} F5000 ; Quick wipe move away from the puddle
    G1 E-1 F300                  ; Retract a tiny amount to prevent stringing
    G1 Z2.0 F3000                ; Lift Z safely before moving to the print coordinates
    
    RESTORE_GCODE_STATE NAME=prime_line_state

#=====================================================
# PRINT_END
#=====================================================
# INSTRUCTIONS:
# Adjust the RETRACT_AMOUNT to suit your extruder (Direct Drive vs Bowden).
# You can also uncomment the "Present Print" section to drop the bed completely.
# @DESC Finalizes the print by turning off heaters, retracting, parking the toolhead, and resetting status.
[gcode_macro PRINT_END]
description: Master print end macro
gcode:
    # --- USER ADJUSTABLE VARIABLES ---
    {% set RETRACT_AMOUNT = 2.0 %}               ; Amount of filament (in mm) to retract at the end of the print
    
    # -------------------------------------------------------------------------
    # 1. RETRACT & CLEARANCE
    # -------------------------------------------------------------------------
    M400                                         ; Wait for buffer to clear
    G92 E0                                       ; Zero the extruder
    G91                                          ; Relative positioning
    
    # Retract and wipe to prevent stringing and relieve nozzle pressure
    G1 E-{RETRACT_AMOUNT} F3600                  ; Retract filament
    G1 Z0.2 F2400                                ; Raise Z slightly to clear the print surface
    G1 X5 Y5 F6000                               ; Short wipe move away from the print
    G1 Z10 F3000                                 ; Raise Z a bit more for safe travel
    G90                                          ; Return to absolute positioning

    # -------------------------------------------------------------------------
    # 2. TURN OFF HEATERS & FANS
    # -------------------------------------------------------------------------
    M104 S0                                      ; Turn off hotend
    M140 S0                                      ; Turn off bed
    M106 S0                                      ; Turn off part cooling fan
    # M141 S0                                    ; Turn off chamber heater (if configured)

    # -------------------------------------------------------------------------
    # 3. PARK TOOLHEAD
    # -------------------------------------------------------------------------
    # _PARK                                       ; Use the MacroBase park position (Requires "_PARK" from MacroBase_Extras)
    
    # Fallback inline park (if the PARK macro is disabled or not included):
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    G1 X{max_x - 10} Y{max_y - 10} F6000         ; Move nozzle to the back-right corner out of the way

    # -------------------------------------------------------------------------
    # 4. PRESENT PRINT (OPTIONAL)
    # -------------------------------------------------------------------------
    # Uncomment the G1 line below to smoothly drop the bed (or raise the toolhead) 
    # to the absolute maximum Z limit for easier part removal.
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    # G1 Z{max_z} F3000                          ; Move Z to maximum position

    # -------------------------------------------------------------------------
    # 5. RESET STATUS & MOTORS
    # -------------------------------------------------------------------------
    M84 X Y E                                    ; Disable X, Y, and Extruder motors
    M84 Z                                        ; Disable Z motors
    
    # CLEAR                                      ; Clear active LED progress templates (Requires "CLEAR" from MacroBase_LED)
    # LED_IDLE                                   ; Return LEDs to idle state (Requires "LED_IDLE" from MacroBase_LED)
    
    M117 Print Complete!

# ==============================================================================
# STATE MACRO VARIABLES & SHARED LOGIC
# ==============================================================================
# INSTRUCTIONS:
# Set your preferred retraction amount in the _MACROBASE_VARS macro below. 
# PAUSE, RESUME, and CANCEL_PRINT all share this single variable. 
# 
# How it prevents double-retractions:
# When you hit CANCEL, the system checks if the printer is currently paused. 
# If it is paused, it knows the filament was already retracted by the PAUSE 
# macro, so it skips the cancel retraction. When you hit RESUME, it references 
# this exact same variable to push the filament back to the exact starting point.
# ==============================================================================

#=====================================================
# _MACROBASE_VARS
#=====================================================
# @DESC Hidden structural macro that stores shared variables (like retract distance) for state macros.
[gcode_macro _MACROBASE_VARS]
description: Storage for shared MacroBase variables
variable_retract_amount: 2.0
gcode:
    # This macro intentionally left blank. It only stores variables.

#=====================================================
# PAUSE
#=====================================================
# @DESC Pauses the active print, retracts filament using the shared variable, and parks the toolhead safely.
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: BASE_PAUSE
gcode:
    # Fetch the shared retract variable
    {% set retract = printer["gcode_macro _MACROBASE_VARS"].retract_amount|float %}
    
    # Save current state and pause
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    
    # Retract and park
    G92 E0
    G91
    G1 E-{retract} F3600
    G1 Z10 F3000
    G90
    
    # Park toolhead safely out of the way
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    G1 X{max_x - 10} Y{max_y - 10} F6000

#=====================================================
# RESUME
#=====================================================
# @DESC Resumes the active print and un-retracts the exact filament amount defined in the shared variable.
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: BASE_RESUME
gcode:
    # Fetch the shared retract variable
    {% set retract = printer["gcode_macro _MACROBASE_VARS"].retract_amount|float %}
    
    # Un-retract
    G91
    G1 E{retract} F3600
    G90
    
    # Restore position and resume
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

#=====================================================
# CANCEL_PRINT
#=====================================================
# @DESC Cancels the active print. Checks if the printer is already paused to prevent double-retraction.
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: BASE_CANCEL_PRINT
gcode:
    # Fetch shared variable and check current state
    {% set retract = printer["gcode_macro _MACROBASE_VARS"].retract_amount|float %}
    {% set is_paused = printer.pause_resume.is_paused %}
    
    # Only retract and move if the print was NOT already paused
    {% if not is_paused %}
        G92 E0
        G91
        G1 E-{retract} F3600
        G1 Z10 F3000
        G90
        
        # Park toolhead
        {% set max_x = printer.toolhead.axis_maximum.x|float %}
        {% set max_y = printer.toolhead.axis_maximum.y|float %}
        G1 X{max_x - 10} Y{max_y - 10} F6000
    {% endif %}
    
    # Turn off heaters and fans
    TURN_OFF_HEATERS
    M106 S0
    
    # Clear pause state and cancel the native Klipper print state
    CLEAR_PAUSE
    BASE_CANCEL_PRINT
    
    # Reset motors
    M84 X Y E
    M84 Z