# ==============================================================================
# MACRO CONFIGURATION & USAGE
# ==============================================================================
# HOW TO ENABLE OR DISABLE MACROS:
# Klipper reads every active macro in this file (If enabled in "MacroBase.cfg"). To disable a specific macro 
# so it doesn't appear in your interface or load into Klipper, you must "comment 
# it out" by placing a hashtag (#) at the very beginning of every line for 
# that specific macro, starting with the [gcode_macro NAME] line.
# 
# To re-enable a macro, simply remove the hashtags from the start of its lines.
# ==============================================================================

# ==============================================================================
# CONFIGURATION INSTRUCTIONS: LED NAMING
# ==============================================================================
# By default, these macros target an LED strip named "my_neopixel".
# Use your code editor's "Find and Replace" feature to change "my_neopixel" 
# to the exact name of your [neopixel] or [led] configuration section.
# If you have multiple strips (e.g., RGB_LED and RGB_LED2), simply duplicate 
# the SET_LED lines inside each macro to control both simultaneously.
# ==============================================================================

# ==============================================================================
# INTEGRATION INSTRUCTIONS: PRINT STATE MACROS
# ==============================================================================
# To fully utilize the dynamic LED templates (like PRINT_PROGRESS, EXTRUDER_TEMP, 
# and LED_PRINT), you must call them from within your printer's state macros.
# 
# Recommended placements:
# - PRINT_START: Add EXTRUDER_TEMP, BED_TEMP, or LED_PRINT to light up the printer.
#                Add PRINT_PROGRESS to initialize the progress bar.
# - PRINT_END: Add LED_IDLE, LED_OFF, or CLEAR to disable effects when finished.
# - CANCEL/PAUSE: Add LED_IDLE or CLEAR to stop the progress bar.
# - RESUME: Add PRINT_PROGRESS to resume the progress tracking.
# ==============================================================================

#=====================================================
# LED_OFF
#=====================================================
# @DESC Turns the configured LED strip completely off.
[gcode_macro LED_OFF]
gcode:
    SET_LED LED=my_neopixel RED=0 GREEN=0 BLUE=0 TRANSMIT=1

#=====================================================
# LED_RED
#=====================================================
# @DESC Turns the configured LED strip to solid red.
[gcode_macro LED_RED]
gcode:
    SET_LED LED=my_neopixel RED=1 GREEN=0 BLUE=0 TRANSMIT=1

#=====================================================
# LED_ORANGE
#=====================================================
# @DESC Turns the configured LED strip to solid orange.
[gcode_macro LED_ORANGE]
gcode:
    SET_LED LED=my_neopixel RED=1 GREEN=0.5 BLUE=0 TRANSMIT=1

#=====================================================
# LED_YELLOW
#=====================================================
# @DESC Turns the configured LED strip to solid yellow.
[gcode_macro LED_YELLOW]
gcode:
    SET_LED LED=my_neopixel RED=1 GREEN=1 BLUE=0 TRANSMIT=1

#=====================================================
# LED_GREEN
#=====================================================
# @DESC Turns the configured LED strip to solid green.
[gcode_macro LED_GREEN]
gcode:
    SET_LED LED=my_neopixel RED=0 GREEN=1 BLUE=0 TRANSMIT=1

#=====================================================
# LED_TEAL
#=====================================================
# @DESC Turns the configured LED strip to solid teal.
[gcode_macro LED_TEAL]
gcode:
    SET_LED LED=my_neopixel RED=0 GREEN=0.5 BLUE=1 TRANSMIT=1
    
#=====================================================
# LED_BLUE
#=====================================================
# @DESC Turns the configured LED strip to solid blue.
[gcode_macro LED_BLUE]
gcode:
    SET_LED LED=my_neopixel RED=0 GREEN=0 BLUE=1 TRANSMIT=1
    
#=====================================================
# LED_PURPLE
#=====================================================
# @DESC Turns the configured LED strip to solid purple.
[gcode_macro LED_PURPLE]
gcode:
    SET_LED LED=my_neopixel RED=1 GREEN=0 BLUE=1 TRANSMIT=1

#=====================================================
# LED_WHITE
#=====================================================
# @DESC Turns the configured LED strip to 100% white brightness.
[gcode_macro LED_WHITE]
gcode:
    SET_LED LED=my_neopixel RED=1 GREEN=1 BLUE=1 TRANSMIT=1

#=====================================================
# LED_PRINT
#=====================================================
# @DESC Sets the configured LED strip to a medium white suitable for printing.
[gcode_macro LED_PRINT]
gcode:
    SET_LED LED=my_neopixel RED=0.5 GREEN=0.5 BLUE=0.5 TRANSMIT=1

#=====================================================
# LED_IDLE
#=====================================================
# @DESC Sets the configured LED strip to a dim purple for idle states.
[gcode_macro LED_IDLE]
gcode:
    SET_LED LED=my_neopixel RED=0.2 GREEN=0 BLUE=0.2 TRANSMIT=1

#=====================================================
# LED_CYCLE
#=====================================================
# @DESC Cycles through a rainbow of solid colors.
[gcode_macro LED_CYCLE]
gcode:
    {% set repeat_count = 4 %}
    {% for repeat in range(repeat_count) %}
        LED_RED
        G4 P100
        LED_ORANGE
        G4 P100
        LED_YELLOW
        G4 P100
        LED_GREEN
        G4 P100
        LED_TEAL
        G4 P100
        LED_BLUE
        G4 P100
        LED_PURPLE
        G4 P100
    {% endfor %}
    LED_IDLE

#=====================================================
# WELCOME_ANIMATION
#=====================================================
# @DESC Plays a dynamic startup animation sequence across the LED chain.
[gcode_macro _WELCOME_ANIMATION]
gcode:
    {% set led = "my_neopixel" %}
    {% set chain_count = printer.configfile.config['neopixel ' ~ led].chain_count|default(1)|int %}
    
    # Turn all off
    SET_LED LED={led} RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    G4 P200
    
    # Chase effect across dynamic length
    {% for i in range(1, chain_count + 1) %}
        SET_LED LED={led} RED=1 GREEN=0 BLUE=1 INDEX={i} TRANSMIT=1
        G4 P50
    {% endfor %}
    
    # Pulse effect
    {% for _ in range(3) %}
        SET_LED LED={led} RED=0.2 GREEN=0 BLUE=0.2 TRANSMIT=1
        G4 P200
        SET_LED LED={led} RED=1 GREEN=0 BLUE=1 TRANSMIT=1
        G4 P200
    {% endfor %}
    LED_IDLE

[delayed_gcode Welcome]
initial_duration: 1
gcode:
    _WELCOME_ANIMATION

#=====================================================
# EXTRUDER_TEMP
#=====================================================
# @DESC Sets the LED strip to visually glow based on the current extruder temperature.
[gcode_macro EXTRUDER_TEMP]
gcode:
    _NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=extruder_temp MODE=glow TRANSMIT=1

#=====================================================
# BED_TEMP
#=====================================================
# @DESC Sets the LED strip to visually glow based on the current bed temperature.
[gcode_macro BED_TEMP]
gcode:
    _NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=bed_temp MODE=glow TRANSMIT=1

#=====================================================
# PRINT_PROGRESS
#=====================================================
# @DESC Sets the LED strip to fill up dynamically based on total print progress.
[gcode_macro PRINT_PROGRESS]
gcode:
    _NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=print_percent MODE=progress TRANSMIT=1

#=====================================================
# PRINT_SPEED
#=====================================================
# @DESC Sets the LED strip to fill up dynamically based on live printer velocity.
[gcode_macro PRINT_SPEED]
gcode:
    _NEOPIXEL_DISPLAY LED="my_neopixel" TYPE=printer_speed MODE=progress TRANSMIT=1

#=====================================================
# CLEAR
#=====================================================
# @DESC Clears any active active LED templates/effects.
[gcode_macro CLEAR]
gcode:
    SET_LED_TEMPLATE LED=my_neopixel TEMPLATE=

#=====================================================
# NEOPIXEL_DISPLAY
#=====================================================
# @DESC Internal helper macro that maps LED templates to the neopixel chain.
[gcode_macro _NEOPIXEL_DISPLAY]
gcode:
    {% set led = params.LED|default("my_neopixel") %}
    {% set type = params.TYPE %}
    {% set mode = params.MODE %}
    {% set my_neopixel = printer.configfile.config['neopixel ' ~ led] %}

    {% if mode == 'progress' %}
        {% for i in range(my_neopixel.chain_count|int) %}
            SET_LED_TEMPLATE LED={led} INDEX={i+1} TEMPLATE={'led_' ~ type ~ '_' ~ mode} param_led_num={i+1} param_led_total={my_neopixel.chain_count|int}
        {% endfor %}
    {% endif %}
    {% if mode == 'glow' %}
        SET_LED_TEMPLATE LED={led} TEMPLATE={'led_' ~ type ~ '_' ~ mode}
    {% endif %}

# ==============================================================================
# DISPLAY TEMPLATES
# ==============================================================================

[display_template led_extruder_temp_glow]
text:
    {% if printer.extruder.target > 0.0 %}
        {%  set temp = printer.extruder.target %}
    {% else %}
        {% set temp = printer.configfile.config.extruder.max_temp %}
    {% endif %}
    {% set ratio = printer.extruder.temperature / temp|float %}
    {ratio}, 0.0, {1-ratio}, 0.0

[display_template led_extruder_temp_progress]
param_led_num:  0
param_led_total: 1
text:
    {% if printer.extruder.target > 0.0 %}
        {%  set temp = printer.extruder.target %}
    {% else %}
        {% set temp = printer.configfile.config.extruder.max_temp %}
    {% endif %}
    {% set ratio = printer.extruder.temperature / temp|float %}
    {% set led_ratio = param_led_num|float / param_led_total %}
    {% if ratio > led_ratio %}
        {led_ratio}, 0.0, 0.0, 0.0
    {% else %}
        0.0, 0.0, 0.0, 0.0
    {% endif %}

[display_template led_bed_temp_glow]
text:
    {% if printer.heater_bed.target > 0.0 %}
        {%  set temp = printer.heater_bed.target %}
    {% else %}
        {% set temp = printer.configfile.config.heater_bed.max_temp %}
    {% endif %}
    {% set ratio = printer.heater_bed.temperature / temp|float %}
    {ratio}, 0.0, {1-ratio}, 0.0

[display_template led_bed_temp_progress]
param_led_num:  0
param_led_total: 1
text:
    {% if printer.heater_bed.target > 0.0 %}
        {%  set temp = printer.heater_bed.target %}
    {% else %}
        {% set temp = printer.configfile.config.heater_bed.max_temp %}
    {% endif %}
    {% set ratio = printer.heater_bed.temperature / temp|float %}
    {% set led_ratio = param_led_num|float / param_led_total %}
    {% if ratio > led_ratio %}
        {led_ratio}, 0.0, 0.0, 0.0
    {% else %}
        0.0, 0.0, 0.0, 0.0
    {% endif %}

[display_template led_print_percent_glow]
text:
    {% set ratio = printer.virtual_sdcard.progress %}
    0.0, {ratio}, 0.0, 0.0

[display_template led_print_percent_progress]
param_led_num:  0
param_led_total: 1
text:
    {% set ratio = printer.virtual_sdcard.progress %}
    {% set led_ratio   = param_led_num|float / param_led_total %}
    {% if ratio > led_ratio %}
        0.0, {led_ratio}, 0.0, 0.0
    {% else %}
        0.0, 0.0, 0.0, 0.0
    {% endif %}

[display_template led_printer_speed_glow]
text:
    {% set ratio  = printer.motion_report.live_velocity|float /  printer.configfile.config.printer.max_velocity|float %}
    0.0, {ratio}, 0.0, 0.0

[display_template led_printer_speed_progress]
param_led_num:  0
param_led_total: 1
text:
    {% set ratio  = printer.motion_report.live_velocity|float /  printer.configfile.config.printer.max_velocity|float %}
    {% set led_ratio    = param_led_num|float / param_led_total %}
    {% if ratio > led_ratio %}
        0.0, {led_ratio}, 0.0, 0.0
    {% else %}
        0.0, 0.0, 0.0, 0.0
    {% endif %}