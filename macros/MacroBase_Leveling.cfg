# ==============================================================================
# MACRO CONFIGURATION & USAGE
# ==============================================================================
# HOW TO ENABLE OR DISABLE MACROS:
# Klipper reads every active macro in this file (If enabled in "MacroBase.cfg"). To disable a specific macro 
# so it doesn't appear in your interface or load into Klipper, you must "comment 
# it out" by placing a hashtag (#) at the very beginning of every line for 
# that specific macro, starting with the [gcode_macro NAME] line.
# 
# To re-enable a macro, simply remove the hashtags from the start of its lines.
# ==============================================================================

#=====================================================
# LEVEL_Z_TILT
#=====================================================
# @DESC Homes the printer if needed and runs Z_TILT_ADJUST to level dual independent Z stepper motors using a probe.
[gcode_macro LEVEL_Z_TILT]
description: Level dual Z motors
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    Z_TILT_ADJUST

#=====================================================
# TRAM_BED
#=====================================================
# @DESC Homes the printer and runs SCREWS_TILT_CALIBRATE to calculate exact manual bed adjustment turns for leveling knobs.
[gcode_macro TRAM_BED]
description: Screw tilt adjust tramming
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SCREWS_TILT_CALIBRATE

#=====================================================
# GENERATE_BED_MESH
#=====================================================
# @DESC Homes the printer, heats the bed, and generates a new automated bed mesh profile.
[gcode_macro GENERATE_BED_MESH]
description: Calibrate bed mesh
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M117 Heating bed for mesh...
    M190 S{BED_TEMP}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CALIBRATE