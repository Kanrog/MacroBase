# ==============================================================================
# MACRO CONFIGURATION & USAGE
# ==============================================================================
# HOW TO ENABLE OR DISABLE MACROS:
# Klipper reads every active macro in this file (If enabled in "MacroBase.cfg"). To disable a specific macro 
# so it doesn't appear in your interface or load into Klipper, you must "comment 
# it out" by placing a hashtag (#) at the very beginning of every line for 
# that specific macro, starting with the [gcode_macro NAME] line.
# 
# To re-enable a macro, simply remove the hashtags from the start of its lines.
# ==============================================================================

#=====================================================
# CLEAN_NOZZLE
#=====================================================
# @DESC Moves the toolhead over a designated maintenance area or brush to clean plastic off the nozzle.
[gcode_macro _CLEAN_NOZZLE]
description: Clean nozzle tip
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    # Adjust X, Y, Z coordinates to match your physical brush location
    G1 X50 Y50 Z5 F6000
    G1 X100 Y50 F6000
    G1 X50 Y50 F6000
    G1 X100 Y50 F6000
    G1 Z10 F1000

#=====================================================
# LUBRICATE_RAILS
#=====================================================
# INSTRUCTIONS:
# Adjust the X_POS, Y_POS, and Z_POS variables below to match the exact 
# position where your printer's linear rails or rods are most accessible.
# 
# @DESC Moves the toolhead and bed to a user-defined maintenance position for easy access to linear rails and bearings.
[gcode_macro LUBRICATE_RAILS]
description: Move to rail lubrication position
gcode:
    # --- USER ADJUSTABLE VARIABLES ---
    {% set X_POS = 150 %}  ; Target X coordinate for lubrication access
    {% set Y_POS = 10 %}   ; Target Y coordinate for lubrication access
    {% set Z_POS = 150 %}  ; Target Z coordinate for lubrication access
    {% set SPEED = 6000 %} ; Travel speed for X and Y in mm/min

    # --- EXECUTION ---
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing...
        G28                          ; Home all axes if not already homed
    {% endif %}
    
    G90                              ; Set to absolute positioning
    
    # Safely route the toolhead to avoid crashing into the bed
    {% if printer.toolhead.position.z < Z_POS %}
        G1 Z{Z_POS} F1500            ; Move Z up first if it's currently lower than the target
    {% endif %}
    
    G1 X{X_POS} Y{Y_POS} F{SPEED}    ; Move X and Y to the target position
    G1 Z{Z_POS} F1500                ; Move Z down to target if it was higher than the target
    
    M117 Lubrication position reached