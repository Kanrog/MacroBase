# ==============================================================================
# MACRO CONFIGURATION & USAGE
# ==============================================================================
# HOW TO ENABLE OR DISABLE MACROS:
# Klipper reads every active macro in this file (If enabled in "MacroBase.cfg"). To disable a specific macro 
# so it doesn't appear in your interface or load into Klipper, you must "comment 
# it out" by placing a hashtag (#) at the very beginning of every line for 
# that specific macro, starting with the [gcode_macro NAME] line.
# 
# To re-enable a macro, simply remove the hashtags from the start of its lines.
# ==============================================================================

#=====================================================
# TORTURE
#=====================================================
# @DESC Test all axis movements at high speeds using percentage-based travel limits relative to printer bounds.
[gcode_macro TORTURE]
description: Test all axis movements at max speeds safely
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_min = printer.toolhead.axis_minimum.y %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  {% set z_min = printer.toolhead.axis_minimum.z %}
  {% set z_max = printer.toolhead.axis_maximum.z %}
  
  {% set x_low = x_min + (x_max - x_min) * 0.1 %}
  {% set x_high = x_min + (x_max - x_min) * 0.9 %}
  {% set y_low = y_min + (y_max - y_min) * 0.1 %}
  {% set y_high = y_min + (y_max - y_min) * 0.9 %}
  {% set z_low = z_min + (z_max - z_min) * 0.05 %}
  {% set z_high = z_min + (z_max - z_min) * 0.8 %}

  G90
  G1 X{x_low} Y{y_low} F10000
  G1 Z{z_low} F5000
  
  {% for repeat in range(8) %}
      G1 X{x_high} F500000
      G1 Y{y_high} F500000
      G1 X{x_low} F500000
      G1 Y{y_low} F500000
      G1 Z{z_high} F450000
      G1 Z{z_low} F450000
      G1 Z{z_high} F450000
      G1 Z{z_low} F450000
  {% endfor %}
  
  {% set x_center = (x_min + x_max) / 2 %}
  {% set y_center = (y_min + y_max) / 2 %}
  {% set x_delta = (x_max - x_min) * 0.05 %}
  {% set y_delta = (y_max - y_min) * 0.05 %}

  G1 X{x_center} Y{y_center} F10000
  {% for repeat in range(8) %}
      G1 X{x_center + x_delta} F800000
      G1 X{x_center - x_delta} F800000
  {% endfor %}
  {% for repeat in range(8) %}
      G1 Y{y_center + y_delta} F800000
      G1 Y{y_center - y_delta} F800000
  {% endfor %}
  G90

#=====================================================
# TORTURE_Z
#=====================================================
# @DESC Test Z axis movements using percentage-based travel limits.
[gcode_macro TORTURE_Z]
description: Test z axis movements safely
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set z_min = printer.toolhead.axis_minimum.z %}
  {% set z_max = printer.toolhead.axis_maximum.z %}
  {% set z_low = z_min + (z_max - z_min) * 0.1 %}
  {% set z_high = z_min + (z_max - z_min) * 0.85 %}
  
  G90
  G1 Z{z_min + (z_max - z_min) * 0.3} F50000
  
  {% set ns = namespace(z_target=z_high) %}
  {% for repeat in range(8) %}
    G1 Z{ns.z_target} F450000
    {% if ns.z_target == z_high %}
      {% set ns.z_target = z_low %}
    {% else %}
      {% set ns.z_target = z_high %}
    {% endif %}
  {% endfor %}
  G90

#=====================================================
# TORTURE_XY
#=====================================================
# @DESC Test X and Y axis movements using percentage-based travel limits.
[gcode_macro TORTURE_XY]
description: Test x and y axis movements safely
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_min = printer.toolhead.axis_minimum.y %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  
  {% set x_low = x_min + (x_max - x_min) * 0.1 %}
  {% set x_high = x_min + (x_max - x_min) * 0.9 %}
  {% set y_low = y_min + (y_max - y_min) * 0.1 %}
  {% set y_high = y_min + (y_max - y_min) * 0.9 %}

  G90
  G1 X{x_low} Y{y_low} F10000
  G1 Z{printer.toolhead.axis_minimum.z + (printer.toolhead.axis_maximum.z - printer.toolhead.axis_minimum.z) * 0.05} F5000
  
  {% for repeat in range(8) %}
    G1 X{x_high} F500000
    G1 Y{y_high} F500000
    G1 X{x_low} F500000
    G1 Y{y_low} F500000
  {% endfor %}
  G90

#=====================================================
# TORTURE_XY_SHORT
#=====================================================
# @DESC Test short X and Y axis movements relative to axis size percentages.
[gcode_macro TORTURE_XY_SHORT]
description: Test short x and y axis movements
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_min = printer.toolhead.axis_minimum.y %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  
  {% set x_center = (x_min + x_max) / 2 %}
  {% set y_center = (y_min + y_max) / 2 %}
  {% set x_delta = (x_max - x_min) * 0.15 %}
  {% set y_delta = (y_max - y_min) * 0.15 %}
  
  G90
  G1 X{x_center} Y{y_center} F10000
  G1 Z{printer.toolhead.axis_minimum.z + (printer.toolhead.axis_maximum.z - printer.toolhead.axis_minimum.z) * 0.05} F5000
  
  {% for repeat in range(8) %}
    G1 X{x_center + x_delta} F500000
    G1 Y{y_center + y_delta} F500000
    G1 X{x_center - x_delta} F500000
    G1 Y{y_center - y_delta} F500000
  {% endfor %}
  G90

#=====================================================
# TORTURE_SHAKE
#=====================================================
# @DESC Rapid oscillation shake test using percentage-based offsets.
[gcode_macro TORTURE_SHAKE]
description: Shake it baby safely
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_min = printer.toolhead.axis_minimum.y %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  
  {% set x_center = (x_min + x_max) / 2 %}
  {% set y_center = (y_min + y_max) / 2 %}
  {% set x_delta = (x_max - x_min) * 0.05 %}
  {% set y_delta = (y_max - y_min) * 0.05 %}
  
  G90
  G1 X{x_center} Y{y_center} F10000
  G1 Z{printer.toolhead.axis_minimum.z + (printer.toolhead.axis_maximum.z - printer.toolhead.axis_minimum.z) * 0.05} F5000
  
  {% for repeat in range(8) %}
    G1 X{x_center + x_delta} F800000
    G1 X{x_center - x_delta} F800000
  {% endfor %}
  {% for repeat in range(8) %}
    G1 Y{y_center + y_delta} F800000
    G1 Y{y_center - y_delta} F800000
  {% endfor %}
  G90

#=====================================================
# CYCLE_XY
#=====================================================
# @DESC Continuous cycling of X and Y axes using percentage-based bounds.
[gcode_macro CYCLE_XY]
description: Test x and y axis movements continuously
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_min = printer.toolhead.axis_minimum.y %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  
  {% set x_low = x_min + (x_max - x_min) * 0.1 %}
  {% set x_high = x_min + (x_max - x_min) * 0.9 %}
  {% set y_low = y_min + (y_max - y_min) * 0.1 %}
  {% set y_high = y_min + (y_max - y_min) * 0.9 %}

  G90
  G1 X{x_low} Y{y_low} F10000
  G1 Z{printer.toolhead.axis_minimum.z + (printer.toolhead.axis_maximum.z - printer.toolhead.axis_minimum.z) * 0.05} F5000
  
  {% for repeat in range(100) %}
    G1 X{x_high} F5000
    G1 Y{y_high} F5000
    G1 X{x_low} F5000
    G1 Y{y_low} F5000
  {% endfor %}
  G90