<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanrog Creations | MacroBase</title>
    <link rel="stylesheet" href="style.css">
    <!-- JSZip for client-side zip generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <!-- Using text as a placeholder, replace with your actual Kanrog logo image -->
            <h1 class="logo-text"><span class="blue">M</span>acro<span class="pink">B</span>ase</h1>
            <p class="subtitle">Tinkering in three dimensions.</p>
        </div>
        
        <nav class="top-nav">
            <button id="btn-select-all" class="nav-btn">Select All</button>
            <button id="btn-clear" class="nav-btn">Clear Selection</button>
            <button id="btn-download" class="nav-btn action-btn">Download Selected ZIP</button>
        </nav>
    </header>

    <main>
        <div class="header-banner">
            <h2>MACROBASE REPOSITORY</h2>
            <p>Select the configuration files you want to include on your printer.</p>
        </div>

        <!-- The parsed macro cards will be injected here by script.js -->
        <div id="macro-grid" class="grid-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
